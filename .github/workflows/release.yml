# Release (issue #47). release-please hält aus den Conventional Commits auf
# main einen Release-PR. Dessen Merge — wie jeder PR erst nach PO-Approval —
# erzeugt Tag `vX.Y.Z`, GitHub-Release und CHANGELOG.md.
#
# Erst dieser Release baut das GHCR-Image mit Versions-Tag UND `:latest`
# (Checkout am Tag, nicht am Branch-Head). Normale main-Merges bauen in
# ci.yml nur noch den SHA-Tag — `:latest` mutiert damit nicht mehr bei jedem
# Merge (DECISIONS #12).
#
# Veröffentlicht wird nichts aus einem Baum, dessen CI nicht grün war:
# `require-green-ci` löst den Tag zum Commit auf und wartet auf dessen
# `ci`-Push-Run. release-please selbst bleibt ungegated — der Release-PR muss
# auch bei rotem main gepflegt werden können, denn er ist das Werkzeug, mit
# dem der Zustand gelesen und repariert wird.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # "true" nur im Lauf, der den Release-PR gemergt hat; jeder andere
      # Push auf main lässt das leer und stoppt damit den Publish-Pfad.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Konfiguriert über `release-please-config.json` und
      # `.release-please-manifest.json` im Repo-Root (statt `release-type`
      # hier), weil eine Version nicht nur ins Changelog muss: sie wird in die
      # Root-package.json geschrieben und in jedes Workspace-Manifest kopiert.
      # Das Manifest ist der Stand, von dem der nächste Release zählt; die
      # Action schreibt es im Release-Commit fort.
      #
      # Das Repo released als eine unbenannte Einheit, der Tag ist deshalb ein
      # nacktes `vX.Y.Z`. Zwei Einstellungen erzeugen das — und eine davon ist
      # die Falle, die in Quorum Geld gekostet hat: leer sein muss
      # `package-name`, NICHT `component`. release-please löst die Komponente
      # als `component || <name aus package.json>` auf, ein leeres `component`
      # fällt also still auf den Paketnamen zurück. Beim Bauen des Release-PRs
      # sieht man davon nichts; es fällt erst beim Merge auf, wenn die
      # Tagging-Phase die Komponente des gemergten Branches gegen die
      # konfigurierte prüft, leeren String gegen Paketnamen findet, nicht
      # taggt — und ein untagged gemergter Release-PR blockiert jeden
      # folgenden Release.
      - uses: googleapis/release-please-action@v4
        id: release

  # Das Gate. Alles, was das Repo verlässt, hängt daran: ein Fehlschlag hier
  # ist ein Release, der nach dem Tag stehen bleibt — kein Image, und ein
  # roter Job, der sagt warum.
  require-green-ci:
    name: Require green CI for the released commit
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Der CI-Lauf des Release-Commits startet aus demselben Push wie dieser
    # Workflow, dieser Job wartet also in der Regel darauf. Das Limit liegt
    # deutlich über einem normalen Lauf (inkl. E2E) und existiert, damit ein
    # hängender Lauf den Release scheitern lässt statt stundenlang einen
    # Runner zu halten.
    timeout-minutes: 45
    permissions:
      # Nur Workflow-Läufe lesen; dieser Job berührt weder Baum noch Release.
      contents: read
      actions: read
    steps:
      - name: Verify the CI workflow succeeded for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Der Tag, nicht der Branch-Head: ein weiterer Merge auf main
          # zwischen Release-Commit und diesem Job würde den Release sonst
          # das CI-Ergebnis eines anderen Commits erben lassen. Es ist genau
          # der Commit, den `publish-image` auscheckt.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "Released commit: $sha"

          # Die ci-Läufe für exakt diesen Commit, neuester zuletzt. Auf
          # push-Events eingeschränkt, weil das ist, was ein Commit auf main
          # erzeugt; ein pull_request-Lauf gehört zu einer Merge-Ref und damit
          # zu einem anderen Baum.
          #
          # Aus jq kommen nur die zwei Skalare heraus: Commit-Betreffs landen
          # in dieser Response, und ein JSON-Blob durch eine Shell-Variable
          # stolpert über die Steuerzeichen, die manche davon enthalten.
          run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push")]
                  | sort_by(.run_number) | last | select(. != null)
                  | "\(.id) \(.html_url)"')

          if [ -z "$run" ]; then
            echo "::error::No CI run exists for $sha. A missing result is not a passing one, so" \
              "this release does not publish. Run the CI workflow for that commit and re-run" \
              "this job."
            exit 1
          fi

          # Der neueste Lauf gewinnt: ein Re-Run nach behobenem
          # Infrastruktur-Fehler ist die Antwort, die zählt.
          id=${run%% *}
          echo "CI run: ${run#* }"

          # Blockiert bis der Lauf fertig ist und endet non-zero, wenn er
          # nicht erfolgreich war — ein noch laufender CI-Lauf wird also
          # abgewartet statt geraten, ein bereits gescheiterter stoppt den
          # Release sofort. `-R`, weil dieser Job nichts auscheckt und die CLI
          # das Repository deshalb nicht ableiten kann.
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null

          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $sha concluded '$conclusion'. Nothing is published from a tree" \
              "whose CI did not pass."
            exit 1
          fi
          echo "CI succeeded for $sha — the release may publish."

  publish-image:
    name: Publish the release image
    needs: [release-please, require-green-ci]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Ein Job-Block ersetzt den Workflow-Block komplett: `packages: write`
      # ist, was GITHUB_TOKEN nach GHCR pushen lässt; mehr als den Baum lesen
      # braucht dieser Job nicht.
      contents: read
      packages: write
    steps:
      # Ausdrücklich der getaggte Commit, nicht der Branch-Head: ein weiterer
      # Merge auf main dazwischen würde sonst unter dieser Versionsnummer
      # gebaut.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      # Keine Repo-Secrets im Spiel: GITHUB_TOKEN genügt für GHCR-Pushes in
      # das eigene Package dieses Repositories.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Build-Id in Bundle UND Server (issue #24) — hier der Tag statt des
          # SHA, damit der Reload-Banner-Vergleich zwischen altem Tab und
          # neuem Server-Stand denselben Wert auf beiden Seiten sieht und ein
          # Release als neue Version erkannt wird.
          build-args: |
            GRIMOIRE_BUILD=${{ needs.release-please.outputs.tag_name }}
          # Kleingeschriebener Owner: GHCR-Repository-Namen sind
          # case-sensitiv, die GitHub-Organisation wird groß geschrieben.
          # Der Versions-Tag ist, worauf ein Deployment festnagelt; `:latest`
          # entsteht nur hier — nicht mehr bei jedem main-Merge.
          # Beide Schreibweisen der Version, damit ein Deployment sowohl
          # `v0.1.0` (wie der Tag/das Release heißt) als auch `0.1.0`
          # festnageln kann.
          tags: |
            ghcr.io/jocur/grimoire:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/jocur/grimoire:${{ needs.release-please.outputs.version }}
            ghcr.io/jocur/grimoire:latest
          # Nur linux/amd64, was der Runner nativ baut. arm64 hieße Emulation
          # und Builds in Zehnerminuten; es gibt kein arm64-Ziel.
          platforms: linux/amd64
          # Geteilt mit ci.yml: der PR, der zum Release-Commit führte, hat den
          # Scope meist schon gefüllt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
