# CI (issue #16). This workflow BUILDS to check and PUBLISHES nothing. GHCR is
# written by .github/workflows/release.yml alone (issue #66, ADR #12): CI's
# green result is the gate that release checks (`require-green-ci`), and the
# published image is built at the version tag.
#
#   test          — every PR and every main push: install, typecheck all
#                   workspaces, tests, app build (runtime: Bun)
#   db-smoke-node — the same DB smoke file on NODE, so the `node:sqlite`
#                   primary backend is proven, not just Bun's fallback
#                   (issue #54, ADR #13)
#   e2e           — after `test`: the real-stack Playwright suite over the
#                   critical paths (CLAUDE.md) — built app, real server,
#                   stub LLM
#   image-build   — after `test`: the Dockerfile, built with `push: false`,
#                   so a broken image surfaces at PR time instead of in the
#                   release run. Nothing leaves the runner but the GHA cache.
#
# Docs: docs/DEPLOYMENT.md (section 1) describes pulling the published image.
name: CI

on:
  # Feature work is always reviewed as a PR (CLAUDE.md, "Branch- & PR-Prozess"),
  # so a per-branch push run only ever duplicated the pull_request run — same
  # commit, same three jobs, twice. Pushes are watched on main only, and that
  # run is load-bearing: `require-green-ci` in release.yml looks for the PUSH
  # run of the released commit, so every commit on main needs one.
  push:
    branches: [main]
  pull_request:

# Superseded runs of the same branch are pointless — except on main, where a
# cancelled run would leave the commit without the green push run a release
# needs (release.yml treats a missing result as a failing one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the lockfile was written with; bump
          # deliberately. setup-bun caches the runtime by default.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Root script fans out to all three workspaces (bun run --filter '*').
      - name: Typecheck (shared, server, app)
        run: bun run typecheck

      - name: Tests
        run: bun test

      # The only real build output in the repo: the Vite bundle the server
      # serves statically in production.
      - name: Build frontend
        run: bun run --filter '@grimoire/app' build

  # The database foundation on the OTHER runtime (issue #54 AK5, ADR #13).
  # Grown with the cutover (issue #57): besides FTS5, transactions, UPSERT and
  # the PRAGMAs, the smoke file now also pins the two mechanisms the store
  # layer newly leans on — a COMPOSITE primary-key update cascading into its
  # child rows (the rename) and quoted FTS5 prefix terms (the search).
  # `test` above already exercises it on Bun, where the driver falls back to
  # `bun:sqlite`; this job runs the same smoke file on Node, where the PRIMARY
  # backend `node:sqlite` is used. Deliberately slim — only that one file, no
  # app build, no browser: it is a driver-maturity early warning, not a second
  # full test suite. If it ever goes red, the Node deployment path is broken
  # even though everything else is green.
  db-smoke-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          # The oldest line we claim to run on. The real floor inside it is
          # 22.16: `node:sqlite` lost its --experimental-sqlite flag in
          # 22.13 and gained StatementSync#setReturnArrays (which the driver
          # needs for drizzle's row mode) in 22.16. setup-node resolves `22`
          # to the newest 22.x, so this stays above that floor.
          node-version: 22

      # Installed with bun (the lockfile is bun's) and then RUN with node —
      # the packages involved are plain JS/TS, nothing is compiled per runtime.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: DB smoke (node:sqlite, FTS5, transactions, UPSERT)
        run: bun run --filter '@grimoire/server' test:db-smoke:node

  # The critical paths of CLAUDE.md, end to end against the real stack: the
  # suite builds the app itself, starts one server process per test on its own
  # freshly seeded database (imported from a copy of examples/beispiel through
  # the real first-run migration) and points it at the local stub LLM
  # (e2e/README.md).
  # Nothing is mocked in the browser, so this job is the strongest signal in
  # the gate a release hangs off.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One browser is enough (the suite is about the stack, not a browser
      # matrix); --with-deps installs the system libraries chromium needs.
      # The workspace binary, NOT `bunx playwright`: bunx resolves the CLI
      # from the registry and follows the latest release, which downloads a
      # browser revision the locked @playwright/test does not launch.
      - name: Install Playwright chromium
        run: ./e2e/node_modules/.bin/playwright install --with-deps chromium

      # Builds the app, starts the stub LLM and the server processes itself.
      - name: E2E (critical paths)
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Proves the Dockerfile still builds — and stops there. `push: false`, no
  # registry login, no `packages` permission: this job CANNOT publish, which
  # is the whole point of ADR #12's addendum (CI builds to check, publishes
  # never). It runs on PRs and on main pushes alike, so a Dockerfile breakage
  # is caught in review rather than after the release tag already exists.
  #
  # `needs: test` only: the image is about the build, not about browser
  # behaviour, so waiting for E2E would just delay the signal.
  image-build:
    name: Build the image (never pushed)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Read the tree, nothing else — deliberately without `packages: write`.
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Same build arg as the release build (issue #24), but the value is
          # throwaway: nothing here is deployed, so the commit SHA is enough
          # to prove the arg is wired through bundle and server.
          build-args: |
            GRIMOIRE_BUILD=${{ github.sha }}
          # Matches the release build so this is the same work, not a
          # different one.
          platforms: linux/amd64
          # The shared GHA cache the release build reads: base layers and the
          # dependency install stay warm between a merge and the next release.
          cache-from: type=gha
          cache-to: type=gha,mode=max
