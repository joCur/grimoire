# CI (issue #16). Three jobs in one workflow on purpose: the image is only ever
# built from a commit whose checks passed, and `needs:` expresses that inside
# one run instead of chaining workflow_run across two files.
#
#   test  — every PR and every main push: install, typecheck all workspaces,
#           tests, app build
#   e2e   — after `test`: the real-stack Playwright suite over the critical
#           paths (CLAUDE.md) — built app, real server, stub LLM
#   image — main only, after `test` + `e2e`: build the Dockerfile, push to
#           GHCR under the commit SHA. The `:latest` and version tags come
#           from .github/workflows/release.yml, only on an actual release.
#
# Docs: docs/DEPLOYMENT.md (section 1) describes pulling the published image.
name: CI

on:
  # Feature work is always reviewed as a PR (CLAUDE.md, "Branch- & PR-Prozess"),
  # so a per-branch push run only ever duplicated the pull_request run — same
  # commit, same three jobs, twice. Pushes are watched on main only: that is
  # where the image job belongs (see its `if` below, which now matches the only
  # ref a push event can carry).
  push:
    branches: [main]
  pull_request:

# Superseded runs of the same branch are pointless — except on main, where a
# cancelled run would also drop the image push for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the lockfile was written with; bump
          # deliberately. setup-bun caches the runtime by default.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Root script fans out to all three workspaces (bun run --filter '*').
      - name: Typecheck (shared, server, app)
        run: bun run typecheck

      - name: Tests
        run: bun test

      # The only real build output in the repo: the Vite bundle the server
      # serves statically in production.
      - name: Build frontend
        run: bun run --filter '@grimoire/app' build

  # The critical paths of CLAUDE.md, end to end against the real stack: the
  # suite builds the app itself, starts one server process per test on a copy
  # of examples/beispiel and points it at the local stub LLM (e2e/README.md).
  # Nothing is mocked in the browser, so this job is the last gate before an
  # image is built.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One browser is enough (the suite is about the stack, not a browser
      # matrix); --with-deps installs the system libraries chromium needs.
      # The workspace binary, NOT `bunx playwright`: bunx resolves the CLI
      # from the registry and follows the latest release, which downloads a
      # browser revision the locked @playwright/test does not launch.
      - name: Install Playwright chromium
        run: ./e2e/node_modules/.bin/playwright install --with-deps chromium

      # Builds the app, starts the stub LLM and the server processes itself.
      - name: E2E (critical paths)
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  image:
    needs: [test, e2e]
    # Still needed after narrowing the push trigger: a pull_request run carries
    # `refs/pull/<n>/merge`, so this keeps the image a main-only artifact. With
    # pushes limited to main, the two now agree instead of overlapping.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No repo secrets involved: GITHUB_TOKEN is enough for GHCR pushes to
      # this repository's own package.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Burns the commit into bundle AND server (issue #24): a tab still
          # running an older bundle then sees the reload banner instead of
          # crashing against the new API.
          build-args: |
            GRIMOIRE_BUILD=${{ github.sha }}
          # Lowercase owner: GHCR repository names are case-sensitive.
          # SHA tag only. `:latest` is built by the release workflow and by
          # nothing else (issue #47, DECISIONS #12) — a main merge must not
          # move the tag a production host pulls by default.
          tags: |
            ghcr.io/jocur/grimoire:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
