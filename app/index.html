<!doctype html>
<!-- lang="de" is only the STARTING value (DEFAULT_LOCALE): the real UI
     language is an instance setting on the server, so I18nProvider sets
     `document.documentElement.lang` as soon as it knows it (issue #69). -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/grimoire-icon.svg" />
    <title>Grimoire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
